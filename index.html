<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVM 2026 Voting System</title>
    <script src="https://www.gstatic.com/firebasejs/10.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div id="page1">
        <h2>Voter Verification</h2>
        <input type="text" id="vName" placeholder="Enter Name">
        <input type="text" id="vPhone" placeholder="Enter 10-digit Phone">
        <button onclick="verifyVoter()">Verify & Proceed</button>
    </div>

    <div id="page2" class="hidden">
        <h2>Select Your Party</h2>
        <button onclick="submitVote('Party A')">Party A</button>
        <button onclick="submitVote('Party B')">Party B</button>
        
        <div style="margin-top: 50px; font-size: 0.8em; color: #888; text-align: center;">
            <p>Created by: Dharanivel</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBfl8J102JW32RX7Yrl5qbuDJFRLx09bWg",
            authDomain: "evm-2026.firebaseapp.com",
            projectId: "evm-2026",
            storageBucket: "evm-2026.firebasestorage.app",
            messagingSenderId: "84858882020",
            appId: "1:84858882020:web:d7fa3af139259f270729f1"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let voterInfo = {};

        window.verifyVoter = async () => {
            const name = document.getElementById('vName').value.trim();
            const phone = document.getElementById('vPhone').value.trim();

            if(name === "" || phone.length !== 10) {
                Swal.fire('Error', 'Invalid Name or Phone', 'error');
                return;
            }

            // --- FAKE NUMBER DETECTION START ---
            // 1. Block identical repeating digits (e.g., 0000000000, 9999999999)
            const isRepeating = /^(\d)\1{9}$/.test(phone);

            // 2. Block common continuous sequential fake lists
            const fakePatterns = [
                "1234567890", "0123456789", "2345678901",
                "9876543210", "0987654321", "8765432109"
            ];
            const isSequential = fakePatterns.includes(phone);

            // If it matches a fake rule, show the requested alert text
            if (isRepeating || isSequential) {
                Swal.fire('Error', 'Enter your Original phone number', 'error');
                return;
            }
            // --- FAKE NUMBER DETECTION END ---

            const q = db.collection("votes").where("phone", "==", phone);
            const snap = await q.get();
            
            if(!snap.empty) {
                Swal.fire('Warning', 'Already Voted', 'warning');
                return;
            }

            voterInfo = { name, phone };
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'block';
        };

        window.submitVote = async (party) => {
            try {
                await db.collection("votes").add({
                    voter: voterInfo.name,
                    phone: voterInfo.phone,
                    party: party,
                    timestamp: new Date()
                });

                Swal.fire({
                    title: 'VOTED ✓',
                    text: 'You voted for ' + party,
                    icon: 'success',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => location.reload());
            } catch (e) {
                console.error(e);
                Swal.fire('Error', 'Submission failed', 'error');
            }
        };
    </script>

    <style>
        .hidden { display: none; }
        body { font-family: sans-serif; padding: 20px; }
    </style>
</body>
</html>
