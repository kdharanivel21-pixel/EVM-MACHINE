<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVM 2026 - Responsive System</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Base Styling */
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #2c3e50; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
            box-sizing: border-box;
        }

        .container { 
            background: #dcdde1; 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 800px; /* PC Limit */
            text-align: center; 
            border: 4px solid #000;
            box-sizing: border-box;
            position: relative;
        }

        .hidden { display: none; }

        /* Page 1 Styling */
        .reg-card { background: white; padding: 20px; border-radius: 8px; border: 2px solid #000; }
        input { 
            width: 100%; 
            max-width: 350px;
            padding: 12px; 
            margin: 10px 0; 
            border: 2px solid #7f8c8d; 
            border-radius: 6px; 
            font-size: 16px; 
            text-align: center;
            box-sizing: border-box;
        }
        .start-btn { 
            width: 100%;
            max-width: 350px;
            padding: 15px; 
            background: #27ae60; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 18px; 
            cursor: pointer; 
            font-weight: bold;
        }

        /* EVM Layout - Flexbox for Order */
        .ballot-box { 
            margin-top: 15px; 
            border: 2px solid #000; 
            background: #7f8c8d; 
            padding: 5px; 
            border-radius: 4px;
        }

        .party-row { 
            background: white; 
            min-height: 70px; 
            border: 2px solid black; 
            display: flex; 
            align-items: stretch; /* Makes all columns same height */
            margin-bottom: 5px; 
            border-radius: 4px; 
            overflow: hidden; 
        }

        .col-symbol { 
            width: 70px; 
            background: white; 
            border-right: 2px solid black; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0;
        }
        .col-symbol img { width: 85%; height: auto; max-height: 60px; object-fit: contain; }

        .col-name { 
            flex: 1; /* Takes all available middle space */
            display: flex; 
            align-items: center; 
            padding: 0 10px; 
            font-size: 20px; 
            font-weight: 900; 
            color: white; 
            text-shadow: 1px 1px 3px #000; 
            border-right: 2px solid black;
            word-break: break-word; /* Prevents long names from breaking layout */
        }

        .col-btn { 
            width: 90px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #bdc3c7; 
            flex-shrink: 0;
        }

        .vote-btn { 
            width: 60px; 
            height: 40px; 
            background: #0984e3; 
            border-radius: 6px; 
            border: 2px solid #000; 
            cursor: pointer; 
            box-shadow: 0 4px #0652dd; 
        }
        .vote-btn:active { 
            background: #ff4757 !important; 
            box-shadow: 0 0px #0652dd; 
            transform: translateY(3px); 
        }

        /* Credits Styling */
        .credit-footer {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #2c3e50;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Gradients */
        .tvk-flag { background: linear-gradient(to bottom, #800000 33.3%, #FFD700 33.3%, #FFD700 66.6%, #800000 66.6%); }
        .bjp-flag { background: linear-gradient(to bottom, #F47216 50%, #00A650 50%); }
        .ntk-flag { background: radial-gradient(circle, #FFFF00 10%, #008000 100%); }
        .aiadmk-flag { background: linear-gradient(to bottom, #ffffff 33.3%, #000000 33.3%, #000000 66.6%, #ff0000 66.6%); }
        .dmk-flag { background: linear-gradient(to bottom, #000000 50%, #ff0000 50%); }
        .inc-flag { background: linear-gradient(to bottom, #FF9933 33.3%, #ffffff 33.3%, #ffffff 66.6%, #128807 66.6%); }

        /* Tablet/Mobile Fixes */
        @media (max-width: 600px) {
            .container { padding: 10px; border-width: 3px; }
            .col-name { font-size: 15px; }
            .col-symbol { width: 60px; }
            .col-btn { width: 75px; }
            .vote-btn { width: 50px; height: 35px; }
            .party-row { min-height: 60px; }
            h1 { font-size: 20px; }
            h2 { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div id="page1" class="container">
        <div class="reg-card">
            <h1>EVM VERIFICATION</h1>
            <input type="text" id="vName" placeholder="Enter Full Name">
            <input type="tel" id="vPhone" placeholder="10 Digit Mobile No" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
            <br>
            <button class="start-btn" id="loginBtn">LOGIN TO VOTE</button>
        </div>
    </div>

    <div id="page2" class="container hidden">
        <h2 style="margin: 5px 0;">BALLOT UNIT</h2>
        <div class="ballot-box">
            <div class="party-row">
                <div class="col-symbol"><img src="TVK.png" alt="TVK"></div>
                <div class="col-name tvk-flag">TVK</div>
                <div class="col-btn"><button class="vote-btn" data-party="TVK"></button></div>
            </div>
            <div class="party-row">
                <div class="col-symbol"><img src="BJP.png" alt="BJP"></div>
                <div class="col-name bjp-flag">BJP</div>
                <div class="col-btn"><button class="vote-btn" data-party="BJP"></button></div>
            </div>
            <div class="party-row">
                <div class="col-symbol"><img src="NTK.png" alt="NTK"></div>
                <div class="col-name ntk-flag">NTK</div>
                <div class="col-btn"><button class="vote-btn" data-party="NTK"></button></div>
            </div>
            <div class="party-row">
                <div class="col-symbol"><img src="download.png" alt="AIADMK"></div>
                <div class="col-name aiadmk-flag">AIADMK</div>
                <div class="col-btn"><button class="vote-btn" data-party="AIADMK"></button></div>
            </div>
            <div class="party-row">
                <div class="col-symbol"><img src="ab67616d00001e020d81ad345f19fec38d26cefc.png" alt="DMK"></div>
                <div class="col-name dmk-flag">DMK</div>
                <div class="col-btn"><button class="vote-btn" data-party="DMK"></button></div>
            </div>
            <div class="party-row">
                <div class="col-symbol"><img src="CONGRESS.png" alt="CONGRESS"></div>
                <div class="col-name inc-flag" style="color:black; text-shadow:none;">CONGRESS</div>
                <div class="col-btn"><button class="vote-btn" data-party="CONGRESS"></button></div>
            </div>
        </div>
        <div class="credit-footer">Created by Dharanivel</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBfl8J102JW32RX7Yrl5qbuDJFRLx09bWg",
            authDomain: "evm-2026.firebaseapp.com",
            projectId: "evm-2026",
            storageBucket: "evm-2026.firebasestorage.app",
            messagingSenderId: "84858882020",
            appId: "1:84858882020:web:d7fa3af139259f270729f1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let voterInfo = {};

        // Helper function to screen basic fake/invalid phone number strings
        function isValidPhoneNumber(phone) {
            if (phone.length !== 10) return false;
            
            // Rejects continuous identical digits like 0000000000, 9999999999
            if (/^(\d)\1{9}$/.test(phone)) return false;

            // Rejects common sequential mock numbers like 1234567890
            if (phone === "1234567890") return false;

            // Ensures the phone number starts with realistic Indian mobile sequences (6, 7, 8, 9)
            if (!/^[6-9]\d{9}$/.test(phone)) return false;

            return true;
        }

        // Setup Event Listeners natively in the Module
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const name = document.getElementById('vName').value.trim();
            const phone = document.getElementById('vPhone').value.trim();

            if (name === "") {
                Swal.fire('Error', 'Please enter your Full Name', 'error');
                return;
            }

            if (!isValidPhoneNumber(phone)) {
                Swal.fire('Error', 'PLEASE ENTER ORIGINAL NUMBER', 'error');
                return;
            }

            try {
                const q = query(collection(db, "votes"), where("phone", "==", phone));
                const snap = await getDocs(q);
                if (!snap.empty) {
                    Swal.fire('Warning', 'Already Voted', 'warning');
                    return;
                }

                voterInfo = { name, phone };
                document.getElementById('page1').classList.add('hidden');
                document.getElementById('page2').classList.remove('hidden');
            } catch (err) {
                console.error("Database connection error: ", err);
                Swal.fire('Error', 'Database connectivity error. Try again.', 'error');
            }
        });

        // Event listener mapping for Ballot selections
        document.querySelectorAll('.vote-btn').forEach(button => {
            button.addEventListener('click', async (e) => {
                const party = e.target.getAttribute('data-party');
                try {
                    await addDoc(collection(db, "votes"), {
                        voter: voterInfo.name,
                        phone: voterInfo.phone,
                        party: party,
                        timestamp: new Date()
                    });

                    Swal.fire({
                        title: 'VOTED ✓',
                        text: party,
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => location.reload());
                } catch (e) {
                    console.error(e);
                    Swal.fire('Error', 'Vote submission failed', 'error');
                }
            });
        });
    </script>
</body>
</html>
