<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVM 2026 - Responsive System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* Base Adaptive Layout Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
        }

        body { 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }

        .container { 
            background: #ffffff; 
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); 
            width: 100%; 
            max-width: 480px; /* Perfect reading boundary on PCs, auto-collapses on phones */
            text-align: center; 
            transition: all 0.3s ease;
        }

        .hidden { display: none !important; }

        /* Modernized Page 1 Layout */
        .reg-card h1 {
            color: #0f172a;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .reg-card p {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .input-wrapper {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-wrapper label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        input { 
            width: 100%; 
            padding: 14px 16px; 
            margin: 0; 
            border: 2px solid #e2e8f0; 
            border-radius: 8px; 
            font-size: 16px; 
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
            background: #f8fafc;
        }
        
        input:focus {
            border-color: #3b82f6;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .start-btn { 
            width: 100%;
            padding: 16px; 
            background: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
            margin-top: 12px;
        }

        .start-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
        }
        
        .start-btn:active {
            transform: translateY(1px);
        }

        /* Page 2 Formatting Preservation */
        #page2 h2 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
        }

        #page2 button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #f9f9f9;
            transition: background 0.2s;
        }

        #page2 button:hover {
            background: #e9e9e9;
        }

        /* Responsiveness Tweak for Mini-screens */
        @media (max-width: 400px) {
            .container {
                padding: 25px 20px;
            }
            .reg-card h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div id="page1" class="container">
        <div class="reg-card">
            <h1>EVM Verification</h1>
            <p>Please enter your credentials access key terminal below.</p>
            
            <div class="input-wrapper">
                <label for="vName">Voter Name</label>
                <input type="text" id="vName" placeholder="Enter Full Name">
            </div>

            <div class="input-wrapper">
                <label for="vPhone">Mobile Authentication</label>
                <input type="text" id="vPhone" placeholder="Enter 10-digit Phone" maxlength="10">
            </div>
            
            <button class="start-btn" onclick="verifyVoter()">VERIFY & PROCEED</button>
        </div>
    </div>

    <div id="page2" class="container hidden">
        <h2>Select Your Party</h2>
        <button onclick="submitVote('Party A')">Party A</button>
        <button onclick="submitVote('Party B')">Party B</button>
        
        <div style="margin-top: 50px; font-size: 0.8em; color: #888; text-align: center;">
            <p>Created by: Dharanivel</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBfl8J102JW32RX7Yrl5qbuDJFRLx09bWg",
            authDomain: "evm-2026.firebaseapp.com",
            projectId: "evm-2026",
            storageBucket: "evm-2026.firebasestorage.app",
            messagingSenderId: "84858882020",
            appId: "1:84858882020:web:d7fa3af139259f270729f1"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let voterInfo = {};

        window.verifyVoter = async () => {
            const name = document.getElementById('vName').value.trim();
            const phone = document.getElementById('vPhone').value.trim();

            if(name === "" || phone.length !== 10) {
                Swal.fire('Error', 'Invalid Name or Phone', 'error');
                return;
            }

            // --- ADVANCED FAKE PHONE PATTERN REJECTION ---
            const repeatedPatterns = /^(\d)\1{9}$/.test(phone); // Blocks instances like 0000000000, 9999999999
            const sequencePatterns = [
                "1234567890", "0123456789", "2345678901",
                "9876543210", "0987654321", "8765432109"
            ];
            const isFakeSequence = sequencePatterns.includes(phone);

            if (repeatedPatterns || isFakeSequence) {
                Swal.fire('Error', 'Enter your Original phone number', 'error');
                return;
            }
            // --- END FAKE DETECTION ---

            const q = db.collection("votes").where("phone", "==", phone);
            const snap = await q.get();
            
            if(!snap.empty) {
                Swal.fire('Warning', 'Already Voted', 'warning');
                return;
            }

            voterInfo = { name, phone };
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
        };

        window.submitVote = async (party) => {
            try {
                await db.collection("votes").add({
                    voter: voterInfo.name,
                    phone: voterInfo.phone,
                    party: party,
                    timestamp: new Date()
                });

                Swal.fire({
                    title: 'VOTED ✓',
                    text: 'You voted for ' + party,
                    icon: 'success',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => location.reload());
            } catch (e) {
                console.error(e);
                Swal.fire('Error', 'Submission failed', 'error');
            }
        };
    </script>
</body>
</html>
