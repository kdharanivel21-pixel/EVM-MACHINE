<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVM 2026 - Responsive System</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Base Styling */
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #2c3e50; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
            box-sizing: border-box;
        }

        .container { 
            background: #dcdde1; 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 800px; 
            text-align: center; 
            border: 4px solid #000;
            box-sizing: border-box;
        }

        .hidden { display: none; }

        /* Page 1 Styling */
        .reg-card { background: white; padding: 20px; border-radius: 8px; border: 2px solid #000; }
        input { 
            width: 100%; 
            max-width: 350px;
            padding: 12px; 
            margin: 10px 0; 
            border: 2px solid #7f8c8d; 
            border-radius: 6px; 
            font-size: 16px; 
            text-align: center;
            box-sizing: border-box;
        }
        .start-btn { 
            width: 100%;
            max-width: 350px;
            padding: 15px; 
            background: #27ae60; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 18px; 
            cursor: pointer; 
            font-weight: bold;
        }

        /* EVM Layout */
        .ballot-box { margin-top: 15px; border: 2px solid #000; background: #7f8c8d; padding: 5px; border-radius: 4px; }
        .party-row { background: white; min-height: 70px; border: 2px solid black; display: flex; align-items: stretch; margin-bottom: 5px; border-radius: 4px; overflow: hidden; }
        .col-symbol { width: 70px; background: white; border-right: 2px solid black; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .col-symbol img { width: 85%; height: auto; max-height: 60px; object-fit: contain; }
        .col-name { flex: 1; display: flex; align-items: center; padding: 0 10px; font-size: 20px; font-weight: 900; color: white; text-shadow: 1px 1px 3px #000; border-right: 2px solid black; word-break: break-word; }
        .col-btn { width: 90px; display: flex; align-items: center; justify-content: center; background: #bdc3c7; flex-shrink: 0; }
        .vote-btn { width: 60px; height: 40px; background: #0984e3; border-radius: 6px; border: 2px solid #000; cursor: pointer; box-shadow: 0 4px #0652dd; }
        .vote-btn:active { background: #ff4757 !important; box-shadow: 0 0px #0652dd; transform: translateY(3px); }

        /* Gradients */
        .tvk-flag { background: linear-gradient(to bottom, #800000 33.3%, #FFD700 33.3%, #FFD700 66.6%, #800000 66.6%); }
        .bjp-flag { background: linear-gradient(to bottom, #F47216 50%, #00A650 50%); }
        .ntk-flag { background: radial-gradient(circle, #FFFF00 10%, #008000 100%); }
        .aiadmk-flag { background: linear-gradient(to bottom, #ffffff 33.3%, #000000 33.3%, #000000 66.6%, #ff0000 66.6%); }
        .dmk-flag { background: linear-gradient(to bottom, #000000 50%, #ff0000 50%); }
        .inc-flag { background: linear-gradient(to bottom, #FF9933 33.3%, #ffffff 33.3%, #ffffff 66.6%, #128807 66.6%); }

        @media (max-width: 600px) {
            .container { padding: 10px; border-width: 3px; }
            .col-name { font-size: 15px; }
            .col-symbol { width: 60px; }
            .col-btn { width: 75px; }
            .vote-btn { width: 50px; height: 35px; }
        }
    </style>
</head>
<body>

    <div id="page1" class="container">
        <div class="reg-card">
            <h1>EVM VERIFICATION</h1>
            <input type="text" id="vName" placeholder="Enter Full Name">
            <input type="tel" id="vPhone" placeholder="10 Digit Mobile No" maxlength="10">
            <br>
            <button class="start-btn" onclick="verifyVoter()">LOGIN TO VOTE</button>
        </div>
    </div>

    <div id="page2" class="container hidden">
        <h2 style="margin: 5px 0;">BALLOT UNIT</h2>
        <div class="ballot-box">
            <div class="party-row"><div class="col-symbol"><img src="TVK.png"></div><div class="col-name tvk-flag">TVK</div><div class="col-btn"><button class="vote-btn" onclick="submitVote('TVK')"></button></div></div>
            <div class="party-row"><div class="col-symbol"><img src="BJP.png"></div><div class="col-name bjp-flag">BJP</div><div class="col-btn"><button class="vote-btn" onclick="submitVote('BJP')"></button></div></div>
            <div class="party-row"><div class="col-symbol"><img src="NTK.png"></div><div class="col-name ntk-flag">NTK</div><div class="col-btn"><button class="vote-btn" onclick="submitVote('NTK')"></button></div></div>
            <div class="party-row"><div class="col-symbol"><img src="download.png"></div><div class="col-name aiadmk-flag">AIADMK</div><div class="col-btn"><button class="vote-btn" onclick="submitVote('AIADMK')"></button></div></div>
            <div class="party-row"><div class="col-symbol"><img src="ab67616d00001e020d81ad345f19fec38d26cefc.png"></div><div class="col-name dmk-flag">DMK</div><div class="col-btn"><button class="vote-btn" onclick="submitVote('DMK')"></button></div></div>
            <div class="party-row"><div class="col-symbol"><img src="CONGRESS.png"></div><div class="col-name inc-flag" style="color:black; text-shadow:none;">CONGRESS</div><div class="col-btn"><button class="vote-btn" onclick="submitVote('CONGRESS')"></button></div></div>
        </div>
        <p style="margin-top: 15px; font-size: 12px; color: #333;">Created by: Dharanivel</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBfl8J102JW32RX7Yrl5qbuDJFRLx09bWg",
            authDomain: "evm-2026.firebaseapp.com",
            projectId: "evm-2026",
            storageBucket: "evm-2026.firebasestorage.app",
            messagingSenderId: "84858882020",
            appId: "1:84858882020:web:d7fa3af139259f270729f1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let voterInfo = {};

        window.verifyVoter = async () => {
            const name = document.getElementById('vName').value.trim();
            const phone = document.getElementById('vPhone').value.trim();

            if(name === "" || phone.length !== 10) {
                Swal.fire('Error', 'Invalid Name or Phone', 'error');
                return;
            }

            const q = query(collection(db, "votes"), where("phone", "==", phone));
            const snap = await getDocs(q);
            if(!snap.empty) {
                Swal.fire('Warning', 'Already Voted', 'warning');
                return;
            }

            voterInfo = { name, phone };
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
        };

        window.submitVote = async (party) => {
            try {
                await addDoc(collection(db, "votes"), {
                    voter: voterInfo.name,
                    phone: voterInfo.phone,
                    party: party,
                    timestamp: new Date()
                });

                Swal.fire({
                    title: 'VOTED ✓',
                    text: party,
                    icon: 'success',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => location.reload());
            } catch (e) {
                console.error(e);
            }
        };
    </script>
</body>
</html>
