<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVM Voting</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

.hidden{
display:none;
}

input{
padding:10px;
width:100%;
max-width:300px;
margin:5px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
padding:10px 15px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.party{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
margin:10px 0;
border-radius:10px;
border:3px solid;
transition:0.3s;
}

.party:hover{
transform:scale(1.02);
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

img{
width:55px;
height:55px;
border-radius:6px;
}

/* PARTY COLORS */

.tvk{
border-color:red;
background:linear-gradient(red,yellow,red);
}

.bjp{
border-color:orange;
background:linear-gradient(orange,green);
}

.ntk{
border-color:green;
background:green;
color:white;
}

.aiadmk{
border-color:black;
background:linear-gradient(white,black,red);
color:white;
}

.dmk{
border-color:black;
background:linear-gradient(black,red);
color:white;
}

.congress{
border-color:green;
background:linear-gradient(orange,white,green);
}

/* POPUP */

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
color:white;
font-size:20px;
text-align:center;
z-index:999;
}

.popup-box{
background:#111;
padding:20px;
border-radius:10px;
animation:pop 0.4s ease;
}

@keyframes pop{

from{
transform:scale(0.5);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginPage" class="card">

<h2>Vote Login</h2>

<input
type="text"
id="name"
placeholder="Enter Name"
>

<input
type="tel"
id="phone"
maxlength="10"
placeholder="Enter 10 Digit Mobile Number"
>

<br><br>

<button onclick="login()">
Next
</button>

</div>

<!-- VOTE PAGE -->

<div id="votePage" class="card hidden">

<h2>Select Party</h2>

<div class="party tvk">
<img src="TVK.png">
TVK
<button onclick="vote('TVK')">Vote</button>
</div>

<div class="party bjp">
<img src="BJP.png">
BJP
<button onclick="vote('BJP')">Vote</button>
</div>

<div class="party ntk">
<img src="NTK.png">
NTK
<button onclick="vote('NTK')">Vote</button>
</div>

<div class="party aiadmk">
<img src="download.png">
AIADMK
<button onclick="vote('AIADMK')">Vote</button>
</div>

<div class="party dmk">
<img src="ab67616d00001e020d81ad345f19fec38d26cefc.png">
DMK
<button onclick="vote('DMK')">Vote</button>
</div>

<div class="party congress">
<img src="CONGRESS.png">
CONGRESS
<button onclick="vote('CONGRESS')">Vote</button>
</div>

</div>

</div>

<!-- SUCCESS POPUP -->

<div id="popup" class="popup">

<div class="popup-box">

<h2>✅ SUCCESSFULLY VOTED</h2>

<p id="msg"></p>

</div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {

getDatabase,
ref,
set,
get,
child

}

from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey: "AIzaSyBfl8J102JW32RX7Yrl5qbuDJFRLx09bWg",

authDomain: "evm-2026.firebaseapp.com",

databaseURL: "https://evm-2026-default-rtdb.firebaseio.com",

projectId: "evm-2026",

storageBucket: "evm-2026.firebasestorage.app",

messagingSenderId: "84858882020",

appId: "1:84858882020:web:d7fa3af139259f270729f1"

};

/* INITIALIZE */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

/* LOGIN */

window.login = function(){

let name = document.getElementById("name").value.trim();

let phone = document.getElementById("phone").value.trim();

phone = phone.replace(/\D/g,'');

if(name === ""){

alert("Enter Name");

return;

}

if(phone.length !== 10){

alert("Enter Valid 10 Digit Mobile Number");

return;

}

/* SAVE USER */

localStorage.setItem(

"user",

JSON.stringify({

name:name,

phone:phone

})

);

/* SHOW VOTING PAGE */

document.getElementById("loginPage").classList.add("hidden");

document.getElementById("votePage").classList.remove("hidden");

}

/* VOTE FUNCTION */

window.vote = async function(party){

try{

let user = JSON.parse(localStorage.getItem("user"));

if(!user){

alert("Login First");

return;

}

/* CHECK ALREADY VOTED */

const snapshot = await get(

child(ref(db),"users/" + user.phone)

);

if(snapshot.exists()){

alert("This Mobile Number Already Voted");

return;

}

/* SAVE TO FIREBASE */

await set(

ref(db,"users/" + user.phone),

{

name:user.name,

phone:user.phone,

vote:party,

time:new Date().toLocaleString()

}

);

/* SUCCESS POPUP */

document.getElementById("msg").innerHTML =

"Name : " + user.name +

"<br><br>Phone : " + user.phone +

"<br><br>Party : " + party;

document.getElementById("popup").style.display = "flex";

/* AUTO RESET */

setTimeout(()=>{

localStorage.clear();

location.reload();

},2000);

}catch(error){

console.log(error);

alert("Firebase Error : " + error.message);

}

}

</script>

</body>
</html>
